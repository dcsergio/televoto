@if (error()) {
  <div class="rounded-lg border border-accent-coral/40 bg-accent-coral/10 p-4 text-accent-coral">{{ error() }}</div>
}

<div class="surface-card bg-bg-secondary/90 p-4">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <p class="text-sm uppercase tracking-[0.2em] text-accent-cyan">Controlli televoto</p>
      <p class="text-sm text-text-secondary">
        {{ votingClosed() ? 'Televoto chiuso — le modifiche ai candidati sono sbloccate.' : 'Televoto aperto — i voti sono in corso.' }}
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" (click)="confirmPrimaryAction()" class="btn btn-tinted">
        {{ primaryActionLabel() }}
      </button>
      <button
        type="button"
        (click)="handleOpenScore()"
        class="btn btn-ghost"
        title="Vista pubblica (tema scuro) — si apre in una nuova scheda"
      >
        Apri Classifica
        <span aria-hidden="true" class="ml-1.5 opacity-60">&#8599;</span>
      </button>
    </div>
  </div>
  <p class="mt-2 text-xs text-text-secondary">
    La Classifica è la vista pubblica proiettata in sala: apre in una nuova scheda con il tema scuro.
  </p>
  <div class="surface-panel mt-4 border-red-500/25 bg-red-500/10 p-3">
    <p class="text-xs font-semibold uppercase tracking-[0.15em] text-red-200">Zona pericolosa</p>
    <button type="button" (click)="confirmResetRanking()" class="btn btn-danger mt-2">
      Azzera classifica
    </button>
  </div>
</div>
