@if (error()) {
  <div class="rounded-lg border border-red-500 bg-red-500/20 p-4 text-red-300">{{ error() }}</div>
}

<div class="rounded-2xl border border-slate-700/90 bg-slate-900/90 p-4">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <p class="text-sm uppercase tracking-[0.2em] text-accent-cyan">Controlli televoto</p>
      <p class="text-sm text-text-secondary">
        {{ votingClosed() ? 'Televoto chiuso — le modifiche ai candidati sono sbloccate.' : 'Televoto aperto — i voti sono in corso.' }}
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button
        type="button"
        (click)="confirmPrimaryAction()"
        [class]="
          votingClosed()
            ? 'rounded-2xl border border-emerald-500/30 bg-emerald-500/20 px-4 py-2 text-emerald-200 hover:bg-emerald-500/30 transition'
            : 'rounded-2xl border border-amber-500/30 bg-amber-500/20 px-4 py-2 text-amber-200 hover:bg-amber-500/30 transition'
        "
      >
        {{ primaryActionLabel() }}
      </button>
      <button
        type="button"
        (click)="handleOpenScore()"
        class="rounded-2xl bg-accent-magenta px-4 py-2 text-sm font-semibold text-white hover:bg-accent-magenta/90 transition"
      >
        Apri Classifica
      </button>
    </div>
  </div>
  <div class="mt-4 rounded-2xl border border-red-500/30 bg-red-500/10 p-3">
    <p class="text-xs font-semibold uppercase tracking-[0.15em] text-red-200">Zona pericolosa</p>
    <button
      type="button"
      (click)="confirmResetRanking()"
      class="mt-2 rounded-2xl border border-red-500/30 bg-red-500/20 px-4 py-2 text-red-200 hover:bg-red-500/30 transition"
    >
      Azzera classifica
    </button>
  </div>
</div>
