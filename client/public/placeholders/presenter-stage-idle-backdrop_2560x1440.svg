<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-label="">
  <title>Sfondo palco — schermata d'attesa Classifica</title>
  <defs>
    <radialGradient id="floor" cx="0.5" cy="1" r="1.1">
      <stop offset="0" stop-color="#2a2010"/>
      <stop offset="0.4" stop-color="#15120c"/>
      <stop offset="1" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffca57" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#ffb020" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.44" r="0.82">
      <stop offset="0.48" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="#060608"/>
  <rect width="2560" height="1440" fill="url(#floor)"/>
  <!-- spotlight fans from above -->
  <g>
    <polygon points="1280,-140 760,1440 1000,1440 1300,-140" fill="url(#beam2)"/>
    <polygon points="1280,-140 1800,1440 1560,1440 1260,-140" fill="url(#beam2)"/>
    <polygon points="1280,-140 500,1440 750,1440" fill="url(#beam2)" opacity="0.5"/>
    <polygon points="1280,-140 2060,1440 1810,1440" fill="url(#beam2)" opacity="0.5"/>
  </g>
  <!-- watermark bars, centre stage -->
  <g>
    <rect x="1110" y="452" width="104" height="490" rx="26" fill="url(#markfade)"/>
    <rect x="1258" y="586" width="104" height="356" rx="26" fill="#ffb020" opacity="0.055"/>
    <rect x="1406" y="700" width="104" height="242" rx="26" fill="#ffb020" opacity="0.038"/>
    <rect x="1090" y="940" width="440" height="3" rx="1.5" fill="#ffd58a" opacity="0.16"/>
  </g>
  <!-- horizon of low bars -->
  <g fill="#ffb020" opacity="0.05">
    <rect x="110" y="1150" width="58" height="290"/>
    <rect x="290" y="1240" width="58" height="200"/>
    <rect x="470" y="1120" width="58" height="320"/>
    <rect x="650" y="1270" width="58" height="170"/>
    <rect x="830" y="1200" width="58" height="240"/>
    <rect x="1690" y="1210" width="58" height="230"/>
    <rect x="1870" y="1140" width="58" height="300"/>
    <rect x="2050" y="1260" width="58" height="180"/>
    <rect x="2230" y="1180" width="58" height="260"/>
    <rect x="2400" y="1240" width="58" height="200"/>
  </g>
  <!-- light dust -->
  <g fill="#ffd76a" opacity="0.14">
    <circle cx="600" cy="360" r="3"/>
    <circle cx="880" cy="240" r="2.5"/>
    <circle cx="1180" cy="420" r="2"/>
    <circle cx="1520" cy="300" r="3"/>
    <circle cx="1820" cy="460" r="2.5"/>
    <circle cx="2020" cy="320" r="2"/>
    <circle cx="760" cy="540" r="2"/>
    <circle cx="1980" cy="600" r="2.5"/>
  </g>
  <rect width="2560" height="1440" fill="url(#vig2)"/>
</svg>
