<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Voto registrato">
  <title>Voto registrato</title>
  <defs>
    <radialGradient id="vcglow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vcbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="vcdisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="24" fill="#0b1210"/>
  <rect width="320" height="320" rx="24" fill="url(#vcglow)"/>
  <rect x="1" y="1" width="318" height="318" rx="23" fill="none" stroke="#34d399" stroke-opacity="0.16"/>
  <!-- confirmation ripples -->
  <circle cx="160" cy="138" r="94" fill="none" stroke="#34d399" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="160" cy="138" r="74" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="2"/>
  <!-- disc + tick -->
  <circle cx="160" cy="138" r="54" fill="#34d399" fill-opacity="0.12" stroke="url(#vcdisc)" stroke-opacity="0.9" stroke-width="6"/>
  <path d="M134 139 l17 17 36 -40" fill="none" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bars rising to green: your voice counts -->
  <g>
    <rect x="126" y="236" width="16" height="22" rx="5" fill="url(#vcbar)" opacity="0.5"/>
    <rect x="150" y="224" width="16" height="34" rx="5" fill="url(#vcbar)" opacity="0.75"/>
    <rect x="174" y="210" width="16" height="48" rx="5" fill="url(#vcbar)"/>
    <rect x="120" y="261" width="80" height="2.5" rx="1.25" fill="#6ee7b7" opacity="0.4"/>
  </g>
</svg>
