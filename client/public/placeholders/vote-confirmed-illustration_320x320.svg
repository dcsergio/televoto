<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Voto registrato">
  <title>Voto registrato</title>
  <defs>
    <radialGradient id="vcglow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vcbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="24" fill="#0c1210"/>
  <rect width="320" height="320" rx="24" fill="url(#vcglow)"/>
  <rect x="1" y="1" width="318" height="318" rx="23" fill="none" stroke="#34d399" stroke-opacity="0.14"/>
  <!-- onde di conferma -->
  <circle cx="160" cy="140" r="92" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="160" cy="140" r="74" fill="none" stroke="#34d399" stroke-opacity="0.22" stroke-width="2"/>
  <!-- disco + spunta -->
  <circle cx="160" cy="140" r="56" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.85" stroke-width="6"/>
  <path d="M133 141 l18 18 37 -41" fill="none" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- barre che salgono al verde: la tua voce conta -->
  <g>
    <rect x="128" y="238" width="16" height="20" rx="5" fill="url(#vcbar)" opacity="0.55"/>
    <rect x="152" y="228" width="16" height="30" rx="5" fill="url(#vcbar)" opacity="0.78"/>
    <rect x="176" y="216" width="16" height="42" rx="5" fill="url(#vcbar)"/>
  </g>
</svg>
