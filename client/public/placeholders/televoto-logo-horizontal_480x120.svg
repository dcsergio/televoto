    <rect x="43" y="46" width="15" height="46" rx="5" fill="#ffb020" opacity="0.72"/>
    <rect x="66" y="62" width="15" height="30" rx="5" fill="#ffb020" opacity="0.46"/>
  </g>
  <!-- wordmark -->
  <text x="112" y="74" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="40" font-weight="600" fill="#f4f4f5" letter-spacing="1.5">TELEVOTO</text>
</svg>
