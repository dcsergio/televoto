<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Televoto">
  <title>Televoto — lockup orizzontale</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset="0.5" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="barEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- mark: descending bars (equaliser / podium) -->
  <g>
    <rect x="18" y="24" width="16" height="72" rx="5.5" fill="url(#bar)"/>
    <rect x="18" y="24" width="16" height="72" rx="5.5" fill="url(#barEdge)"/>
    <rect x="42" y="43" width="16" height="53" rx="5.5" fill="#ffb020" opacity="0.72"/>
    <rect x="66" y="60" width="16" height="36" rx="5.5" fill="#ffb020" opacity="0.46"/>
    <rect x="16" y="99" width="68" height="2" rx="1" fill="#ffd58a" opacity="0.4"/>
  </g>
  <!-- wordmark -->
  <text x="108" y="79" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="44" font-weight="600" fill="#f4f4f5" letter-spacing="2.5">TELEVOTO</text>
</svg>
