<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Televoto">
  <title>Televoto — simbolo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="stagelight" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <clipPath id="round"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <rect width="256" height="256" fill="url(#stagelight)"/>
    <rect x="0" y="196" width="256" height="60" fill="#000000" opacity="0.28"/>
    <g>
      <rect x="71" y="52" width="30" height="148" rx="11" fill="url(#mbar)"/>
      <rect x="113" y="94" width="30" height="106" rx="11" fill="#ffb020" opacity="0.72"/>
      <rect x="155" y="132" width="30" height="68" rx="11" fill="#ffb020" opacity="0.46"/>
    </g>
    <rect x="60" y="199" width="136" height="2" rx="1" fill="#ffb020" opacity="0.32"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
