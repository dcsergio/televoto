<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Televoto — vota in diretta">
  <title>Televoto — anteprima social</title>
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="ogpool" cx="0.16" cy="0.72" r="0.8">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#ogpool)"/>
  <!-- barre-firma grandi, a filo del bordo destro -->
  <g opacity="0.5">
    <rect x="980" y="150" width="70" height="480" rx="20" fill="#ffb020" opacity="0.14"/>
    <rect x="1074" y="260" width="70" height="370" rx="20" fill="#ffb020" opacity="0.10"/>
    <rect x="1168" y="350" width="70" height="280" rx="20" fill="#ffb020" opacity="0.07"/>
  </g>
  <!-- tick accento -->
  <rect x="96" y="150" width="52" height="8" rx="4" fill="#ffb020"/>
  <!-- mark -->
  <g transform="translate(96,214)">
    <rect x="0" y="0" width="34" height="150" rx="12" fill="url(#ogbar)"/>
    <rect x="48" y="42" width="34" height="108" rx="12" fill="#ffb020" opacity="0.72"/>
    <rect x="96" y="80" width="34" height="70" rx="12" fill="#ffb020" opacity="0.46"/>
  </g>
  <!-- wordmark + tagline -->
  <text x="258" y="330" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="94" font-weight="700" fill="#f4f4f5" letter-spacing="2">TELEVOTO</text>
  <rect x="262" y="356" width="360" height="3" rx="1.5" fill="#ffb020" opacity="0.55"/>
  <text x="262" y="410" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="30" fill="#a1a1aa">Vota in diretta. Pubblico e giuria, una sola classifica.</text>
</svg>
