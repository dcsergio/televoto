<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Televoto — vota in diretta">
  <title>Televoto — anteprima social</title>
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="ogpool" cx="0.2" cy="0.78" r="0.9">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset="0.5" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="ogedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ogvig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#ogpool)"/>
  <!-- faint broadcast grid -->
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0 158 H1200 M0 315 H1200 M0 472 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <!-- oversized signature bars, bleeding off the right edge -->
  <g>
    <rect x="944" y="120" width="78" height="510" rx="22" fill="#ffb020" opacity="0.16"/>
    <rect x="1046" y="238" width="78" height="392" rx="22" fill="#ffb020" opacity="0.11"/>
    <rect x="1148" y="336" width="78" height="294" rx="22" fill="#ffb020" opacity="0.07"/>
  </g>
  <!-- accent tick -->
  <rect x="100" y="150" width="56" height="8" rx="4" fill="#ffb020"/>
  <!-- mark -->
  <g transform="translate(100,206)">
    <rect x="0" y="0" width="36" height="158" rx="12" fill="url(#ogbar)"/>
    <rect x="0" y="0" width="36" height="158" rx="12" fill="url(#ogedge)"/>
    <rect x="50" y="44" width="36" height="114" rx="12" fill="#ffb020" opacity="0.72"/>
    <rect x="100" y="84" width="36" height="74" rx="12" fill="#ffb020" opacity="0.46"/>
    <rect x="-4" y="162" width="144" height="3" rx="1.5" fill="#ffd58a" opacity="0.4"/>
  </g>
  <!-- wordmark + tagline -->
  <text x="264" y="330" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="96" font-weight="700" fill="#f4f4f5" letter-spacing="3">TELEVOTO</text>
  <rect x="268" y="356" width="392" height="3" rx="1.5" fill="#ffb020" opacity="0.55"/>
  <text x="268" y="414" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="29" fill="#a1a1aa">Vota in diretta. Pubblico e giuria, una sola classifica.</text>
  <rect width="1200" height="630" fill="url(#ogvig)"/>
</svg>
