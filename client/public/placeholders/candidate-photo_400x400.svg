<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Foto candidato — segnaposto">
  <title>Foto candidato — segnaposto (ritratto)</title>
  <defs>
    <linearGradient id="cpbg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1b1b20"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="cpspot" cx="0.5" cy="0.34" r="0.66">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cpfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <clipPath id="cpround"><rect width="400" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#cpround)">
    <rect width="400" height="400" fill="url(#cpbg)"/>
    <rect width="400" height="400" fill="url(#cpspot)"/>
    <!-- portrait silhouette -->
    <g fill="#ffb020" fill-opacity="0.07" stroke="#ffb020" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round">
      <circle cx="200" cy="150" r="52"/>
      <path d="M110 350 C110 262 150 214 200 214 C250 214 290 262 290 350 Z"/>
    </g>
    <rect x="0" y="250" width="400" height="150" fill="url(#cpfade)"/>
  </g>
  <!-- crop marks -->
  <g stroke="#ffb020" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M24 24 h26 M24 24 v26"/>
    <path d="M376 24 h-26 M376 24 v26"/>
    <path d="M24 376 h26 M24 376 v-26"/>
    <path d="M376 376 h-26 M376 376 v-26"/>
  </g>
  <text x="200" y="356" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="#f4f4f5" letter-spacing="0.5">Foto candidato</text>
  <text x="200" y="378" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12.5" fill="#a1a1aa">400 &#215; 400 &#183; ritratto quadrato</text>
</svg>
