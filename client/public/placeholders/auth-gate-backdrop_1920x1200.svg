<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-label="">
  <title>Sfondo pagina di accesso</title>
  <defs>
    <radialGradient id="pool" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#1e1810"/>
      <stop offset="0.45" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffca57" stop-opacity="0.13"/>
      <stop offset="0.65" stop-color="#ffb020" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#pool)"/>
  <!-- spotlight beams from above -->
  <g>
    <polygon points="960,-60 700,1200 900,1200 985,-60" fill="url(#beam)"/>
    <polygon points="960,-60 1220,1200 1035,1200 985,-60" fill="url(#beam)"/>
    <polygon points="470,-60 250,1200 430,1200" fill="url(#beam)" opacity="0.55"/>
    <polygon points="1450,-60 1670,1200 1490,1200" fill="url(#beam)" opacity="0.55"/>
  </g>
  <!-- signature bars, watermark -->
