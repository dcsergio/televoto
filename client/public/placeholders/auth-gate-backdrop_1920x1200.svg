<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-label="">
  <title>Sfondo pagina di accesso</title>
  <defs>
    <radialGradient id="pool" cx="0.5" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#1b160c"/>
      <stop offset="0.5" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1200" fill="url(#pool)"/>
  <!-- fasci di luce dall'alto -->
  <g>
    <polygon points="960,-40 720,1200 900,1200 980,-40" fill="url(#beam)"/>
    <polygon points="960,-40 1200,1200 1030,1200 980,-40" fill="url(#beam)"/>
    <polygon points="500,-40 260,1200 430,1200" fill="url(#beam)" opacity="0.6"/>
    <polygon points="1440,-40 1680,1200 1500,1200" fill="url(#beam)" opacity="0.6"/>
  </g>
  <!-- barre-firma in filigrana -->
  <g>
    <rect x="812" y="560" width="72" height="340" rx="18" fill="url(#hero)"/>
    <rect x="924" y="650" width="72" height="250" rx="18" fill="#ffb020" opacity="0.08"/>
    <rect x="1036" y="730" width="72" height="170" rx="18" fill="#ffb020" opacity="0.05"/>
  </g>
  <!-- skyline di barre sul fondo -->
  <g fill="#ffb020" opacity="0.06">
    <rect x="0" y="1052" width="46" height="148"/>
    <rect x="80" y="980" width="46" height="220"/>
    <rect x="160" y="1096" width="46" height="104"/>
    <rect x="240" y="1010" width="46" height="190"/>
    <rect x="320" y="1110" width="46" height="90"/>
    <rect x="400" y="1044" width="46" height="156"/>
    <rect x="480" y="964" width="46" height="236"/>
    <rect x="560" y="1084" width="46" height="116"/>
    <rect x="640" y="1024" width="46" height="176"/>
    <rect x="720" y="1102" width="46" height="98"/>
    <rect x="800" y="1000" width="46" height="200"/>
    <rect x="1120" y="1030" width="46" height="170"/>
    <rect x="1200" y="1094" width="46" height="106"/>
    <rect x="1280" y="972" width="46" height="228"/>
    <rect x="1360" y="1064" width="46" height="136"/>
    <rect x="1440" y="1016" width="46" height="184"/>
    <rect x="1520" y="1104" width="46" height="96"/>
    <rect x="1600" y="1040" width="46" height="160"/>
    <rect x="1680" y="988" width="46" height="212"/>
    <rect x="1760" y="1088" width="46" height="112"/>
