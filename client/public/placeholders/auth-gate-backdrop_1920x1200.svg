    <rect x="922" y="636" width="80" height="274" rx="22" fill="#ffb020" opacity="0.07"/>
    <rect x="1038" y="720" width="80" height="190" rx="22" fill="#ffb020" opacity="0.045"/>
    <rect x="792" y="909" width="326" height="3" rx="1.5" fill="#ffd58a" opacity="0.16"/>
  </g>
